<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Aceptamos tarjetas · tira 20 × 8 cm · vinil interior</title>
  <style>
    @page { size: 200mm 80mm; margin: 0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #fff;
      font-family: Helvetica, Arial, "Nimbus Sans", sans-serif;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .sheet {
      width: 100%;
      height: 100%;
      padding: 8% 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 3%;
    }
    .kicker {
      font-size: 8pt;
      letter-spacing: 0.28em;
      font-weight: 700;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      color: #111;
    }
    .marks {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 7mm;
    }
    .mark {
      flex: 1;
      height: 22mm;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mark img, .contactless {
      max-width: 100%;
      max-height: 22mm;
      object-fit: contain;
      display: block;
    }
    .contactless { height: 16mm; }
  </style>
</head>
<body>
  <div class="sheet">
    <p class="kicker">ACEPTAMOS</p>
    <div class="marks">
      <div class="mark"><img src="../logos/visa.svg" alt="Visa" /></div>
      <div class="mark"><img src="../logos/mastercard2019.svg" alt="Mastercard" /></div>
      <div class="mark"><img src="../logos/amex.svg" alt="American Express" /></div>
      <img class="contactless" src="../logos/contactless.svg" alt="Contactless" />
    </div>
  </div>
</body>
</html>
