<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Rappi · círculo 28 cm · banderola</title>
  <style>
    @page { size: 280mm 350mm; margin: 0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #d9d9d9;
      font-family: Helvetica, Arial, "Nimbus Sans", sans-serif;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .sheet {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .disc {
      width: min(100vw, 80vh);
      height: min(100vw, 80vh);
      border-radius: 50%;
      background: #ff441f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4%;
    }
    .disc img {
      width: 62%;
      height: auto;
      display: block;
    }
    .line {
      font-size: clamp(16px, 3.2vw, 28px);
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div class="sheet">
    <div class="disc">
      <img src="../logos/rappi-blanco.svg" alt="Rappi" />
      <p class="line">Pide en Rappi</p>
    </div>
  </div>
</body>
</html>
