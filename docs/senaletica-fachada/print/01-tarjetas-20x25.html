<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Aceptamos tarjetas · 20 × 25 cm · vinil interior</title>
  <style>
    @page { size: 200mm 250mm; margin: 0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #fff;
      font-family: Helvetica, Arial, "Nimbus Sans", sans-serif;
      color: #111;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .sheet {
      width: 100%;
      height: 100%;
      padding: 7%;
    }
    .plaque {
      width: 100%;
      height: 100%;
      border: 0.35mm solid #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16mm;
      padding: 16mm 12mm;
    }
    .kicker {
      font-size: 13pt;
      letter-spacing: 0.42em;
      font-weight: 700;
      color: #111;
    }
    .marks {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 7mm;
    }
    .mark {
      flex: 1 1 0;
      height: 36mm;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mark img {
      max-width: 100%;
      max-height: 36mm;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }
    .foot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6mm;
    }
    .contactless {
      height: 20mm;
      width: auto;
    }
    .sub {
      font-size: 9pt;
      letter-spacing: 0.2em;
      font-weight: 600;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="sheet">
    <div class="plaque">
    <p class="kicker">ACEPTAMOS</p>
    <div class="marks">
      <div class="mark"><img src="../logos/visa.svg" alt="Visa" /></div>
      <div class="mark"><img src="../logos/mastercard2019.svg" alt="Mastercard" /></div>
      <div class="mark"><img src="../logos/amex.svg" alt="American Express" /></div>
    </div>
    <div class="foot">
      <img class="contactless" src="../logos/contactless.svg" alt="Contactless" />
      <p class="sub">DÉBITO · CRÉDITO · CONTACTLESS</p>
    </div>
    </div>
  </div>
</body>
</html>
