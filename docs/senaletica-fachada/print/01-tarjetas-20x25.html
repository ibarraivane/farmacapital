<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Aceptamos tarjetas · 20 × 25 cm · vinil interior</title>
  <style>
    @page { size: 200mm 250mm; margin: 0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #fff;
      font-family: Helvetica, Arial, "Nimbus Sans", sans-serif;
      color: #111;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .sheet {
      width: 100%;
      height: 100%;
      padding: 5%;
    }
    .plaque {
      width: 100%;
      height: 100%;
      border: 0.45mm solid #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8%;
      padding: 8% 6%;
    }
    .kicker {
      font-size: 7.2vmin;
      letter-spacing: 0.18em;
      font-weight: 800;
      color: #111;
    }
    .marks {
      width: auto;
      max-width: 94%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.2vmin;
    }
    .mark {
      flex: 0 0 auto;
      height: 26vmin;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mark img {
      max-width: 32vmin;
      max-height: 26vmin;
      width: auto;
      height: 26vmin;
      object-fit: contain;
      display: block;
    }
    .foot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3%;
    }
    .contactless {
      height: 10vmin;
      width: auto;
    }
    .sub {
      font-size: 3.8vmin;
      letter-spacing: 0.1em;
      font-weight: 700;
      color: #222;
    }
  </style>
</head>
<body>
  <div class="sheet">
    <div class="plaque">
    <p class="kicker">ACEPTAMOS</p>
    <div class="marks">
      <div class="mark"><img src="../logos/visa.svg" alt="Visa" /></div>
      <div class="mark"><img src="../logos/mastercard2019.svg" alt="Mastercard" /></div>
      <div class="mark"><img src="../logos/amex.svg" alt="American Express" /></div>
    </div>
    <div class="foot">
      <img class="contactless" src="../logos/contactless.svg" alt="Contactless" />
      <p class="sub">DÉBITO · CRÉDITO · CONTACTLESS</p>
    </div>
    </div>
  </div>
</body>
</html>
