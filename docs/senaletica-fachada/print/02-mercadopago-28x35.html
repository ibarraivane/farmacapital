<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Recargas y servicios · Mercado Pago · 28 × 35 cm</title>
  <style>
    @page { size: 280mm 350mm; margin: 0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #ffe600;
      font-family: Helvetica, Arial, "Nimbus Sans", sans-serif;
      color: #111;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .sheet {
      width: 100%;
      height: 100%;
      padding: 5.5% 6% 4.5%;
      display: flex;
      flex-direction: column;
    }
    .logo-wrap {
      background: #fff;
      border-radius: 18px;
      padding: 4.5% 5%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-wrap img {
      width: 88%;
      height: auto;
      display: block;
    }
    .title {
      margin: 5% 1% 0;
      font-size: clamp(22px, 4.2vw, 42px);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.05;
      color: #111;
    }
    .lead {
      margin: 1.5% 1% 0;
      font-size: clamp(13px, 2.1vw, 20px);
      font-weight: 500;
      color: #222;
    }
    .block {
      margin-top: 4%;
      background: #fff;
      border-radius: 18px;
      padding: 4% 4.5% 4.5%;
    }
    .label {
      font-size: 8.5pt;
      letter-spacing: 0.22em;
      font-weight: 800;
      color: #263287;
      margin-bottom: 6mm;
    }
    .carriers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5mm 8mm;
      align-items: center;
    }
    .carrier {
      height: 16mm;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 3mm;
    }
    .carrier img {
      max-width: 100%;
      max-height: 14mm;
      object-fit: contain;
      display: block;
    }
    .carrier.unefon {
      background: #111;
      border-radius: 3mm;
      height: 16mm;
    }
    .carrier.unefon img { max-height: 10mm; }
    .services {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4mm 6mm;
    }
    .svc {
      font-size: 13.5pt;
      font-weight: 700;
      color: #111;
      letter-spacing: -0.01em;
    }
    .note {
      margin-top: auto;
      padding-top: 4%;
      font-size: clamp(11px, 1.6vw, 15px);
      color: #222;
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <div class="sheet">
    <div class="logo-wrap">
      <img src="../logos/mp-oficial-horizontal.svg" alt="Mercado Pago" />
    </div>
    <h1 class="title">Recargas y pago<br />de servicios</h1>
    <p class="lead">En la terminal Point, en efectivo.</p>

    <section class="block">
      <p class="label">RECARGAS</p>
      <div class="carriers">
        <div class="carrier"><img src="../logos/telcel.svg" alt="Telcel" /></div>
        <div class="carrier"><img src="../logos/movistar.svg" alt="Movistar" /></div>
        <div class="carrier"><img src="../logos/att.svg" alt="AT&amp;T" /></div>
        <div class="carrier unefon"><img src="../logos/unefon.png" alt="Unefon" /></div>
      </div>
    </section>

    <section class="block">
      <p class="label">PAGO DE SERVICIOS</p>
      <div class="services">
        <p class="svc">Luz</p>
        <p class="svc">Agua</p>
        <p class="svc">Internet</p>
        <p class="svc">Telefonía</p>
      </div>
    </section>

    <p class="note">Solo las compañías que aparecen en la Point Smart. Pregunta en mostrador.</p>
  </div>
</body>
</html>
