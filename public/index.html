<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <!-- minimum-scale evita que iOS/Safari “re-encuadre” la página al cargar; maximum-scale conserva zoom manual (accesibilidad). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, viewport-fit=cover" />

    <!-- PWA / Theme -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1E3ABA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0D1B2A" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FarmaCapital" />
    <meta name="application-name" content="FarmaCapital" />
    <meta name="msapplication-TileColor" content="#1E3ABA" />

    <!-- Tipografía oficial FarmaCapital — Poppins (similar a fuente de logotipo) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />

    <!-- SEO -->
    <title>FarmaCapital — Farmacia & Salud · Chinampac de Juárez, CDMX</title>
    <meta name="description" content="FarmaCapital — Medicamentos genéricos y de marca, consultorio médico y tienda en línea. Chinampac de Juárez, Iztapalapa, CDMX." />
    <meta name="keywords" content="farmacia, medicamentos, genéricos, consultorio médico, Iztapalapa, CDMX, FarmaCapital" />
    <meta name="author" content="FarmaCapital" />

    <!-- Open Graph (redes sociales) -->
    <meta property="og:title" content="FarmaCapital — Farmacia & Salud" />
    <meta property="og:description" content="Medicamentos genéricos y de marca, consultorio médico y tienda en línea. Chinampac de Juárez, CDMX." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://farmacapital.mx" />
    <meta property="og:image" content="%PUBLIC_URL%/icons/farmacapital-512.png" />
    <meta property="og:locale" content="es_MX" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="FarmaCapital — Farmacia & Salud" />
    <meta name="twitter:description" content="Medicamentos genéricos y de marca, consultorio médico y tienda en línea." />
    <meta name="twitter:image" content="%PUBLIC_URL%/icons/farmacapital-512.png" />

    <!-- Favicon adaptativo: a color en modo claro, blanco+verde en modo oscuro -->
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg?v=7" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32.png?v=7" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32-dark.png?v=7" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/icons/farmacapital-16.png?v=7" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/icons/farmacapital-16-dark.png?v=7" media="(prefers-color-scheme: dark)" />
    <script>
      (function () {
        var v = "7";
        var base = "%PUBLIC_URL%" || "";
        function pickHref() {
          var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          return base + (dark ? "/favicon-32-dark.png?v=" + v : "/favicon-32.png?v=" + v);
        }
        function applyFavicon() {
          var el = document.getElementById("fc-favicon-dynamic");
          if (!el) {
            el = document.createElement("link");
            el.id = "fc-favicon-dynamic";
            el.rel = "icon";
            el.type = "image/png";
            el.sizes = "32x32";
            document.head.appendChild(el);
          }
          el.href = pickHref();
        }
        applyFavicon();
        if (window.matchMedia) {
          window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyFavicon);
        }
      })();
    </script>
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />

    <!-- Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Preconnect fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Estilos base -->
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        height: auto;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        height: auto;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        /* Evita zoom por doble toque; overscroll auto evita scroll “pegajoso” en iOS. */
        touch-action: manipulation;
        overscroll-behavior-y: auto;
      }
      /* Splash screen mientras carga */
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        background: #1E3ABA;
        display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 20px;
        transition: opacity 0.5s ease;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      .splash-logo img {
        height: 56px;
        width: auto;
        max-width: min(calc(100vw - 48px), 320px);
        display: block;
        object-fit: contain;
      }
      .splash-sub {
        color: rgba(255,255,255,0.72);
        font-size: 12px;
        letter-spacing: 2px;
        text-transform: uppercase;
        font-weight: 600;
      }
      .splash-loader {
        width: 48px;
        height: 3px;
        background: rgba(255,255,255,0.25);
        border-radius: 2px;
        overflow: hidden;
      }
      .splash-loader-bar {
        height: 100%;
        width: 40%;
        background: #ffffff;
        border-radius: 2px;
        animation: splash-bar 1.2s ease-in-out infinite;
      }
      @keyframes splash-bar {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(320%); }
      }
      /* Ocultar scrollbar en móvil */
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 2px; }
      /* Safe area para iPhone X+ */
      .safe-top    { padding-top: env(safe-area-inset-top); }
      .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
    </style>
  </head>
  <body>
    <!-- Splash screen -->
    <div id="splash">
      <div class="splash-logo">
        <img src="%PUBLIC_URL%/brand/farmacapital-logo-full-light.png?v=6" srcset="%PUBLIC_URL%/brand/farmacapital-logo-full-light@1x.png?v=6 812w, %PUBLIC_URL%/brand/farmacapital-logo-full-light.png?v=6 1623w" sizes="320px" alt="FarmaCapital" decoding="async" />
      </div>
      <div class="splash-sub">Farmacia & Salud</div>
      <div class="splash-loader"><div class="splash-loader-bar"></div></div>
    </div>

    <noscript>Para usar FarmaCapital necesitas activar JavaScript en tu navegador.</noscript>
    <div id="root"></div>

    <script>
      // Registrar Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .catch(e => console.warn('SW error:', e));
        });
      }
      // Ocultar splash cuando React carga
      window.addEventListener('load', () => {
        setTimeout(() => {
          const splash = document.getElementById('splash');
          if (splash) {
            splash.classList.add('hide');
            setTimeout(() => splash.remove(), 500);
          }
        }, 1200);
      });
    </script>
  </body>
</html>
