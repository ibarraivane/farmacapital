<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <!-- minimum-scale evita que iOS/Safari “re-encuadre” la página al cargar; maximum-scale conserva zoom manual (accesibilidad). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, viewport-fit=cover" />

    <!-- PWA / Theme -->
    <meta name="theme-color" content="#1E3ABA" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FarmaCapital" />
    <meta name="application-name" content="FarmaCapital" />
    <meta name="msapplication-TileColor" content="#1E3ABA" />

    <!-- Tipografía oficial FarmaCapital — Poppins (similar a fuente de logotipo) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />

    <!-- SEO -->
    <title>FarmaCapital — Farmacia & Salud · Chinampac de Juárez, CDMX</title>
    <meta name="description" content="FarmaCapital — Medicamentos genéricos y de marca, consultorio médico y tienda en línea. Chinampac de Juárez, Iztapalapa, CDMX." />
    <meta name="keywords" content="farmacia, medicamentos, genéricos, consultorio médico, Iztapalapa, CDMX, FarmaCapital" />
    <meta name="author" content="FarmaCapital" />

    <!-- Open Graph (redes sociales) -->
    <meta property="og:title" content="FarmaCapital — Farmacia & Salud" />
    <meta property="og:description" content="Medicamentos genéricos y de marca, consultorio médico y tienda en línea. Chinampac de Juárez, CDMX." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://farmacapital.mx" />
    <meta property="og:image" content="%PUBLIC_URL%/icons/farmacapital-512.png" />
    <meta property="og:locale" content="es_MX" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="FarmaCapital — Farmacia & Salud" />
    <meta name="twitter:description" content="Medicamentos genéricos y de marca, consultorio médico y tienda en línea." />
    <meta name="twitter:image" content="%PUBLIC_URL%/icons/farmacapital-512.png" />

    <!-- Icons — FarmaCapital logo oficial (cruz verde + fondo verde) -->
    <link rel="icon" href="%PUBLIC_URL%/icons/farmacapital-192.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />

    <!-- Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Preconnect fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Estilos base -->
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        height: auto;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        height: auto;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        /* Evita zoom por doble toque; overscroll auto evita scroll “pegajoso” en iOS. */
        touch-action: manipulation;
        overscroll-behavior-y: auto;
      }
      /* Splash screen mientras carga */
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        background: linear-gradient(135deg, #0f2d6e, #1a56db);
        display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 16px;
        transition: opacity 0.5s ease;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      .splash-logo {
        display: flex; align-items: center; justify-content: center;
      }
      .splash-text { color: #fff; font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
      .splash-sub { color: rgba(255,255,255,0.7); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }
      .splash-loader {
        width: 40px; height: 3px; background: rgba(255,255,255,0.3);
        border-radius: 2px; overflow: hidden; margin-top: 8px;
      }
      .splash-loader-bar {
        height: 100%; width: 0; background: #fff; border-radius: 2px;
        animation: load 1.5s ease forwards;
      }
      @keyframes load { to { width: 100%; } }
      /* Ocultar scrollbar en móvil */
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 2px; }
      /* Safe area para iPhone X+ */
      .safe-top    { padding-top: env(safe-area-inset-top); }
      .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
    </style>
  </head>
  <body>
    <!-- Splash screen -->
    <div id="splash">
      <div class="splash-logo">
        <!-- Isotipo FarmaCapital — cruz azul marino + arco verde -->
        <svg width="64" height="64" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="21" y="4" width="14" height="48" rx="7" fill="white"/>
          <rect x="4" y="21" width="48" height="14" rx="7" fill="white"/>
          <path d="M42 14 A20 20 0 1 0 42 42" stroke="#22C55E" stroke-width="5.5" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="splash-text">FARMACAPITAL</div>
      <div class="splash-sub">Farmacia & Salud</div>
      <div class="splash-loader"><div class="splash-loader-bar"></div></div>
    </div>

    <noscript>Para usar FarmaCapital necesitas activar JavaScript en tu navegador.</noscript>
    <div id="root"></div>

    <script>
      // Registrar Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .catch(e => console.warn('SW error:', e));
        });
      }
      // Ocultar splash cuando React carga
      window.addEventListener('load', () => {
        setTimeout(() => {
          const splash = document.getElementById('splash');
          if (splash) {
            splash.classList.add('hide');
            setTimeout(() => splash.remove(), 500);
          }
        }, 1200);
      });
    </script>
  </body>
</html>
