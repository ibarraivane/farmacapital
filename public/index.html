    <script>
      (function () {
        var v = "9";
        var base = "%PUBLIC_URL%" || "";
        function pickHref() {
          var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          return base + (dark ? "/favicon-32-dark.png?v=" + v : "/favicon-32.png?v=" + v);
        }
        function applyFavicon() {
          var el = document.getElementById("fc-favicon-dynamic");
          if (!el) {
            el = document.createElement("link");
            el.id = "fc-favicon-dynamic";
            el.rel = "icon";
            el.type = "image/png";
            el.sizes = "32x32";
            document.head.appendChild(el);
          }
          el.href = pickHref();
        }
        applyFavicon();
        if (window.matchMedia) {
          window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyFavicon);
        }
      })();
    </script>

    <!-- Estilos base -->
    <style>
      /* Duplicado intencional de src/theme/tokens.js: el splash necesita
         estos valores antes de que cargue el bundle de React. */
      :root {
        --fc-ink: #001534;
        --fc-blue: #054ABC;
        --fc-jade: #02A158;
        --fc-canvas: #F4ECE2;
        --fc-surface: #FBFAF8;
        --fc-border: #E4D9CA;
        --fc-accent: #C9451F;
        --fc-text-mid: #5A6472;
        --fc-display: 'Fraunces', Georgia, serif;
        --fc-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        height: auto;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      body {
        font-family: var(--fc-body);
        background: var(--fc-canvas);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        height: auto;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        /* Evita zoom por doble toque; overscroll auto evita scroll “pegajoso” en iOS. */
        touch-action: manipulation;
        overscroll-behavior-y: auto;
      }
      /* Intro FarmaCapital — HTML/CSS/SVG, logo oficial PNG.
         Proporciones medidas del maestro 1623×358:
         cruz 0–21.072%, centro 10.505%, wordmark desde 25.570%. */
      #splash {
        --fc-gutter: max(22px, env(safe-area-inset-left), env(safe-area-inset-right));
        --fc-logo-w: min(calc(100vw - 2 * var(--fc-gutter)), clamp(300px, 62vw, 680px));
        --fc-logo-h: calc(var(--fc-logo-w) * 358 / 1623);
        --fc-cross-w: 0.21072;
        --fc-cross-c: 0.10505;
        --fc-shift: 0.39495;
        --fc-clip-r: 78.928%;
        --fc-text-x: 25.57%;
        position: fixed;
        inset: 0;
        z-index: 9999;
        background:
          radial-gradient(ellipse 72% 50% at 50% 48%, #E7F1FB 0%, rgba(246, 248, 250, 0) 64%),
          #F6F8FA;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        isolation: isolate;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        touch-action: none;
        transition: opacity 0.32s ease;
      }
      @media (max-width: 480px) {
        #splash { --fc-logo-w: calc(100vw - 2 * var(--fc-gutter)); }
      }
      #splash.fc-intro-out .fc-intro-logo,
      #splash.fc-intro-out .fc-intro-sub {
        opacity: 0 !important;
        transition: opacity 0.18s ease !important;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      .fc-intro-stage {
        position: relative;
        z-index: 3;
        width: var(--fc-logo-w);
        height: var(--fc-logo-h);
        max-width: 100%;
        aspect-ratio: 1623 / 358;
        flex-shrink: 0;
      }
      .fc-intro-logo {
        display: block;
        width: 100%;
        height: 100%;
        max-width: 100%;
        aspect-ratio: 1623 / 358;
        object-fit: contain;
        opacity: 0;
        transform-origin: 10.505% 50%;
        transform: translateX(calc(var(--fc-shift) * 100%)) scale(0.84);
        clip-path: inset(0 var(--fc-clip-r) 0 0);
        -webkit-clip-path: inset(0 var(--fc-clip-r) 0 0);
        will-change: transform, clip-path;
      }
      #splash.fc-intro-cross .fc-intro-logo {
        opacity: 1;
        transform: translateX(calc(var(--fc-shift) * 100%)) scale(1);
        transition:
          opacity 0.16s ease,
          transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      }
      #splash.fc-intro-reveal .fc-intro-logo {
        opacity: 1;
        transform: translateX(0) scale(1);
        clip-path: inset(0 0 0 0);
        -webkit-clip-path: inset(0 0 0 0);
        transition:
          transform 0.58s cubic-bezier(0.22, 1, 0.36, 1),
          clip-path 0.58s cubic-bezier(0.22, 1, 0.36, 1),
          -webkit-clip-path 0.58s cubic-bezier(0.22, 1, 0.36, 1),
          opacity 0.16s ease;
      }
      .fc-intro-sub {
        position: absolute;
        left: var(--fc-text-x);
        width: calc(100% - var(--fc-text-x));
        top: calc(100% + 6px);
        margin: 0;
        color: var(--fc-text-mid);
        font-family: var(--fc-body);
        font-size: clamp(13px, 2.4vw, 16px);
        font-weight: 600;
        letter-spacing: 0.18em;
        line-height: 1.15;
        text-transform: uppercase;
        text-align: center;
        opacity: 0;
        transform: translateY(4px);
        pointer-events: none;
      }
      #splash.fc-intro-sub-on .fc-intro-sub {
        opacity: 1;
        transform: translateY(0);
        transition: opacity 0.28s ease, transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .fc-intro-lines {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 2;
      }
      .fc-hair {
        position: absolute;
        background: currentColor;
        opacity: 0;
        border-radius: 0;
      }
      .fc-hair-navy { color: var(--fc-ink); }
      .fc-hair-blue { color: var(--fc-blue); }
      .fc-hair-jade { color: var(--fc-jade); }
      .fc-hair-h { height: 2px; width: min(46vw, 320px); }
      .fc-hair-v { width: 2px; height: min(38vh, 260px); }
      .fc-hair-left {
        top: calc(50% - 1px);
        right: 50%;
        transform-origin: right center;
        transform: translate3d(-36vw, calc(var(--fc-logo-h) * -0.42), 0);
      }
      .fc-hair-top {
        left: calc(50% - 1px);
        bottom: 50%;
        transform-origin: center bottom;
        transform: translate3d(calc(var(--fc-logo-h) * -0.42), -30vh, 0);
      }
      .fc-hair-right {
        top: calc(50% - 1px);
        left: 50%;
        transform-origin: left center;
        transform: translate3d(36vw, calc(var(--fc-logo-h) * 0.42), 0);
      }
      .fc-hair-bot {
        left: calc(50% - 1px);
        top: 50%;
        transform-origin: center top;
        transform: translate3d(calc(var(--fc-logo-h) * 0.42), 30vh, 0);
      }
      #splash.fc-intro-play .fc-hair {
        animation: fc-hair-in 0.52s cubic-bezier(0.18, 0.82, 0.2, 1) forwards;
      }
      #splash.fc-intro-play .fc-hair-left  { animation-delay: 0.00s; }
      #splash.fc-intro-play .fc-hair-top   { animation-delay: 0.03s; }
      #splash.fc-intro-play .fc-hair-right { animation-delay: 0.02s; }
      #splash.fc-intro-play .fc-hair-bot   { animation-delay: 0.05s; }
      #splash.fc-intro-cross .fc-hair {
        animation: fc-hair-out 0.16s ease forwards;
      }
      @keyframes fc-hair-in {
        0%   { opacity: 0; }
        14%  { opacity: 1; }
        100% { transform: translate3d(0, 0, 0); opacity: 1; }
      }
      @keyframes fc-hair-out {
        to { opacity: 0; transform: scale(0.35); }
      }
      @media (prefers-reduced-motion: reduce) {
        .fc-intro-lines { display: none; }
        .fc-intro-logo {
          opacity: 1 !important;
          transform: none !important;
          clip-path: none !important;
          -webkit-clip-path: none !important;
          transition: none !important;
        }
        .fc-intro-sub {
          opacity: 1 !important;
          transform: none !important;
          transition: none !important;
        }
      }
      /* Ocultar scrollbar en móvil */
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-thumb { background: var(--fc-border-hi, #CFC0AC); border-radius: 2px; }
      /* Safe area para iPhone X+ */
      .safe-top    { padding-top: env(safe-area-inset-top); }
      .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
    </style>
  </head>
  <body>
    <!-- Intro FarmaCapital: líneas → cruz oficial → cortinilla del wordmark -->
    <div id="splash" role="img" aria-label="FarmaCapital" aria-busy="true">
      <div class="fc-intro-lines" aria-hidden="true">
        <span class="fc-hair fc-hair-navy fc-hair-h fc-hair-left"></span>
        <span class="fc-hair fc-hair-navy fc-hair-v fc-hair-top"></span>
        <span class="fc-hair fc-hair-blue fc-hair-h fc-hair-right"></span>
        <span class="fc-hair fc-hair-jade fc-hair-v fc-hair-bot"></span>
      </div>
      <div class="fc-intro-stage">
        <img
          class="fc-intro-logo"
          src="%PUBLIC_URL%/brand/farmacapital-logo-full.png?v=6"
          srcset="%PUBLIC_URL%/brand/farmacapital-logo-full@1x.png?v=6 812w, %PUBLIC_URL%/brand/farmacapital-logo-full.png?v=6 1623w"
          sizes="(max-width: 480px) calc(100vw - 44px), (max-width: 1100px) 62vw, 680px"
          alt="FarmaCapital"
          width="1623"
          height="358"
          decoding="sync"
          fetchpriority="high"
          draggable="false"
        />
        <p class="fc-intro-sub">Farmacia &amp; Salud</p>
      </div>
    </div>

    <noscript>Para usar FarmaCapital necesitas activar JavaScript en tu navegador.</noscript>
    <div id="root"></div>

    <script>
      // Registrar Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .catch(e => console.warn('SW error:', e));
        });
      }
      // Intro: React (src/index.js) y 'load' solo avisan que la app está lista.
      // Si llegan antes, se espera la secuencia mínima. Si tardan, el logo
      // completo se queda en pantalla y el desvanecido ocurre al estar listos.
      (function () {
        var splash = document.getElementById('splash');
        var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var appReady = false;
        var sequenceDone = false;
        var hiding = false;

        function ocultar() {
          if (hiding || !splash || splash.classList.contains('hide')) return;
          if (!sequenceDone) return;
          if (!appReady) return;
          hiding = true;
          splash.setAttribute('aria-busy', 'false');
          var logo = splash.querySelector('.fc-intro-logo');
          if (logo) logo.style.willChange = 'auto';
          splash.classList.add('fc-intro-out');
          setTimeout(function () {
            splash.classList.add('hide');
            setTimeout(function () {
              if (splash && splash.parentNode) splash.remove();
            }, 340);
          }, 180);
        }

        window.__fcOcultarSplash = function () {
          appReady = true;
          ocultar();
        };

        function terminarSecuencia() {
          sequenceDone = true;
          ocultar();
        }

        function iniciar() {
          if (!splash) {
            sequenceDone = true;
            return;
          }
          if (reduced) {
            splash.classList.add('fc-intro-reduced', 'fc-intro-cross', 'fc-intro-reveal', 'fc-intro-sub-on');
            setTimeout(terminarSecuencia, 280);
            return;
          }
          splash.offsetWidth;
          splash.classList.add('fc-intro-play');
          setTimeout(function () { splash.classList.add('fc-intro-cross'); }, 540);
          setTimeout(function () { splash.classList.add('fc-intro-reveal'); }, 820);
          setTimeout(function () {
            splash.classList.add('fc-intro-sub-on');
            var logoEl = splash.querySelector('.fc-intro-logo');
            if (logoEl) logoEl.style.willChange = 'auto';
          }, 1420);
          setTimeout(terminarSecuencia, 2320);
        }

        iniciar();

        window.addEventListener('load', function () {
          window.__fcOcultarSplash();
        });
        setTimeout(function () {
          appReady = true;
          sequenceDone = true;
          ocultar();
        }, 10000);
      })();
    </script>
