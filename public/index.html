    <script>
      (function () {
        var v = "9";
        var base = "%PUBLIC_URL%" || "";
        function pickHref() {
          var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          return base + (dark ? "/favicon-32-dark.png?v=" + v : "/favicon-32.png?v=" + v);
        }
        function applyFavicon() {
          var el = document.getElementById("fc-favicon-dynamic");
          if (!el) {
            el = document.createElement("link");
            el.id = "fc-favicon-dynamic";
            el.rel = "icon";
            el.type = "image/png";
            el.sizes = "32x32";
            document.head.appendChild(el);
          }
          el.href = pickHref();
        }
        applyFavicon();
        if (window.matchMedia) {
          window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyFavicon);
        }
      })();
    </script>

    <!-- Estilos base -->
    <style>
      /* Duplicado intencional de src/theme/tokens.js: el splash necesita
         estos valores antes de que cargue el bundle de React. */
      :root {
        --fc-ink: #001534;
        --fc-canvas: #F4ECE2;
        --fc-surface: #FBFAF8;
        --fc-border: #E4D9CA;
        --fc-accent: #C9451F;
        --fc-text-mid: #5A6472;
        --fc-display: 'Fraunces', Georgia, serif;
        --fc-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        height: auto;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      body {
        font-family: var(--fc-body);
        background: var(--fc-canvas);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        height: auto;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        /* Evita zoom por doble toque; overscroll auto evita scroll “pegajoso” en iOS. */
        touch-action: manipulation;
        overscroll-behavior-y: auto;
      }
      /* Intro animada pre-React — sin GIF/video; solo HTML/CSS/SVG/JS */
      #splash {
        --fc-ink: #001534;
        --fc-blue: #054ABC;
        --fc-jade: #02A158;
        --fc-cross-ratio: 0.2107;
        --fc-logo-w: min(100%, clamp(280px, 58vw, 560px));
        --fc-logo-h: calc(var(--fc-logo-w) * 358 / 1623);
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: var(--fc-canvas);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        padding:
          max(16px, env(safe-area-inset-top, 0px))
          max(24px, env(safe-area-inset-right, 0px))
          max(16px, env(safe-area-inset-bottom, 0px))
          max(24px, env(safe-area-inset-left, 0px));
        transition: opacity 0.36s ease;
      }
      #splash.hide { opacity: 0; pointer-events: none; }

      .fc-intro {
        position: relative;
        width: min(100%, var(--fc-logo-w));
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .fc-intro-lines {
        position: absolute;
        left: 50%;
        top: 50%;
        width: min(72vw, 220px);
        height: min(72vw, 220px);
        transform: translate(-50%, calc(-50% - 10px));
        overflow: visible;
        pointer-events: none;
        opacity: 0;
      }
      .fc-intro-lines .fc-streak {
        fill: none;
        stroke-linecap: round;
        vector-effect: non-scaling-stroke;
      }

      .fc-intro-core {
        position: relative;
        z-index: 2;
        width: var(--fc-logo-w);
        max-width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .fc-intro-logo-frame {
        overflow: hidden;
        width: calc(var(--fc-logo-w) * var(--fc-cross-ratio));
        height: var(--fc-logo-h);
        max-width: 100%;
        opacity: 0;
        transform: scale(0.94);
        will-change: width, opacity, transform;
      }
      .fc-intro-logo {
        display: block;
        width: var(--fc-logo-w);
        height: var(--fc-logo-h);
        max-width: none;
        object-fit: contain;
        user-select: none;
        -webkit-user-drag: none;
      }

      .fc-intro-tag {
        margin-top: 8px;
        color: var(--fc-text-mid);
        font-family: var(--fc-body);
        font-size: clamp(13px, 2.8vw, 17px);
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        text-align: center;
        line-height: 1.2;
        opacity: 0;
        transform: translateY(6px);
        will-change: opacity, transform;
      }

      /* Secuencia ~2.55 s hasta logo completo; el fade espera a React */
      .fc-intro--play .fc-intro-lines {
        animation:
          fc-lines-in 0.12s ease-out forwards,
          fc-lines-out 0.28s ease-in 0.55s forwards;
      }
      .fc-intro--play .fc-streak-1 {
        stroke: var(--fc-ink);
        stroke-width: 3.2;
        stroke-dasharray: 120;
        stroke-dashoffset: 120;
        animation: fc-dash 0.42s cubic-bezier(0.2, 0.8, 0.2, 1) 0.06s forwards;
      }
      .fc-intro--play .fc-streak-2 {
        stroke: var(--fc-blue);
        stroke-width: 2.6;
        stroke-dasharray: 120;
        stroke-dashoffset: 120;
        animation: fc-dash 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) 0.12s forwards;
      }
      .fc-intro--play .fc-streak-3 {
        stroke: var(--fc-jade);
        stroke-width: 2.2;
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        animation: fc-dash 0.38s cubic-bezier(0.2, 0.8, 0.2, 1) 0.16s forwards;
      }
      .fc-intro--play .fc-streak-4 {
        stroke: var(--fc-ink);
        stroke-width: 3;
        stroke-dasharray: 110;
        stroke-dashoffset: 110;
        animation: fc-dash 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) 0.1s forwards;
      }
      .fc-intro--play .fc-streak-5 {
        stroke: var(--fc-blue);
        stroke-width: 2.4;
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        animation: fc-dash 0.36s cubic-bezier(0.2, 0.8, 0.2, 1) 0.18s forwards;
      }
      .fc-intro--play .fc-streak-6 {
        stroke: var(--fc-jade);
        stroke-width: 2;
        stroke-dasharray: 90;
        stroke-dashoffset: 90;
        animation: fc-dash 0.34s cubic-bezier(0.2, 0.8, 0.2, 1) 0.22s forwards;
      }
      .fc-intro--play .fc-intro-logo-frame {
        animation:
          fc-cross-in 0.26s ease-out 0.5s forwards,
          fc-curtain 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.72s forwards;
      }
      .fc-intro--play .fc-intro-tag {
        animation: fc-tag-in 0.3s ease-out 1.22s forwards;
      }

      @keyframes fc-dash {
        to { stroke-dashoffset: 0; }
      }
      @keyframes fc-lines-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes fc-lines-out {
        from { opacity: 1; transform: translate(-50%, calc(-50% - 10px)) scale(1); }
        to { opacity: 0; transform: translate(-50%, calc(-50% - 10px)) scale(0.86); }
      }
      @keyframes fc-cross-in {
        from { opacity: 0; transform: scale(0.94); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes fc-curtain {
        from { width: calc(var(--fc-logo-w) * var(--fc-cross-ratio)); }
        to { width: var(--fc-logo-w); }
      }
      @keyframes fc-tag-in {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* Accesibilidad: logo completo sin movimientos fuertes */
      @media (prefers-reduced-motion: reduce) {
        .fc-intro-lines { display: none !important; }
        .fc-intro-logo-frame {
          width: var(--fc-logo-w);
          opacity: 1;
          transform: none;
          animation: none !important;
        }
        .fc-intro-tag {
          opacity: 1;
          transform: none;
          animation: none !important;
        }
        #splash { transition: opacity 0.2s ease; }
      }
      .fc-intro--reduced .fc-intro-lines { display: none; }
      .fc-intro--reduced .fc-intro-logo-frame {
        width: var(--fc-logo-w);
        opacity: 1;
        transform: none;
      }
      .fc-intro--reduced .fc-intro-tag {
        opacity: 1;
        transform: none;
      }
      /* Ocultar scrollbar en móvil */
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-thumb { background: var(--fc-border-hi, #CFC0AC); border-radius: 2px; }
      /* Safe area para iPhone X+ */
      .safe-top    { padding-top: env(safe-area-inset-top); }
      .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
    </style>
  </head>
  <body>
    <!-- Intro de marca (pre-React): líneas → cruz oficial → cortinilla wordmark → tagline → fade -->
    <div id="splash" role="presentation" aria-hidden="true">
      <div class="fc-intro" id="fc-intro">
        <svg class="fc-intro-lines" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
          <!-- Horizontales (entran desde los lados) -->
          <path class="fc-streak fc-streak-1" d="M -28 50 H 72" />
          <path class="fc-streak fc-streak-2" d="M 128 46 H 28" />
          <path class="fc-streak fc-streak-3" d="M -18 54 H 58" />
          <!-- Verticales (entran desde arriba/abajo) -->
          <path class="fc-streak fc-streak-4" d="M 50 -24 V 76" />
          <path class="fc-streak fc-streak-5" d="M 46 124 V 30" />
          <path class="fc-streak fc-streak-6" d="M 54 -10 V 62" />
        </svg>
        <div class="fc-intro-core">
          <div class="fc-intro-logo-frame">
            <img
              class="fc-intro-logo"
              src="%PUBLIC_URL%/brand/farmacapital-logo-full.png?v=6"
              srcset="%PUBLIC_URL%/brand/farmacapital-logo-full@1x.png?v=6 812w, %PUBLIC_URL%/brand/farmacapital-logo-full.png?v=6 1623w"
              sizes="(max-width: 600px) calc(100vw - 48px), 560px"
              width="1623"
              height="358"
              alt="FarmaCapital"
              decoding="sync"
              fetchpriority="high"
            />
          </div>
          <div class="fc-intro-tag">Farmacia &amp; Salud</div>
        </div>
      </div>
    </div>

    <noscript>Para usar FarmaCapital necesitas activar JavaScript en tu navegador.</noscript>
    <div id="root"></div>

    <script>
      // Registrar Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/service-worker.js')
            .catch(function (e) { console.warn('SW error:', e); });
        });
      }

      // Intro: no ocultar hasta completar la secuencia mínima Y que la app esté lista.
      // React llama __fcOcultarSplash al montar; 'load' es respaldo.
      (function () {
        var splash = document.getElementById('splash');
        var intro = document.getElementById('fc-intro');
        if (!splash || !intro) return;

        var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var MIN_MS = reduced ? 420 : 2480;
        var FADE_MS = reduced ? 200 : 340;
        var appReady = false;
        var minDone = false;
        var hiding = false;

        function tryHide() {
          if (hiding || !appReady || !minDone) return;
          hiding = true;
          splash.classList.add('hide');
          setTimeout(function () {
            if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
          }, FADE_MS);
        }

        window.__fcOcultarSplash = function () {
          appReady = true;
          tryHide();
        };

        intro.classList.add(reduced ? 'fc-intro--reduced' : 'fc-intro--play');

        setTimeout(function () {
          minDone = true;
          splash.classList.add('fc-intro-ready');
          tryHide();
        }, MIN_MS);

        window.addEventListener('load', function () {
          window.__fcOcultarSplash();
        });
      })();
    </script>
