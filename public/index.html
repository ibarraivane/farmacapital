    <!-- Favicon: badge azul + cruz blanca (zona segura 18%, legible en tabs oscuras) -->
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg?v=9" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32.png?v=9" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32-dark.png?v=9" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/icons/farmacapital-16.png?v=9" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/icons/farmacapital-16-dark.png?v=9" media="(prefers-color-scheme: dark)" />
    <script>
      (function () {
        var v = "9";
        var base = "%PUBLIC_URL%" || "";
        function pickHref() {
          var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          return base + (dark ? "/favicon-32-dark.png?v=" + v : "/favicon-32.png?v=" + v);
        }
        function applyFavicon() {
          var el = document.getElementById("fc-favicon-dynamic");
          if (!el) {
            el = document.createElement("link");
            el.id = "fc-favicon-dynamic";
            el.rel = "icon";
            el.type = "image/png";
            el.sizes = "32x32";
            document.head.appendChild(el);
          }
          el.href = pickHref();
        }
        applyFavicon();
        if (window.matchMedia) {
          window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyFavicon);
        }
      })();
    </script>

    <!-- Estilos base -->
    <style>
      /* Duplicado intencional de src/theme/tokens.js: el splash necesita
         estos valores antes de que cargue el bundle de React. */
      :root {
        --fc-ink: #001534;
        --fc-canvas: #F4ECE2;
        --fc-surface: #FBFAF8;
        --fc-border: #E4D9CA;
        --fc-accent: #C9451F;
        --fc-text-mid: #5A6472;
        --fc-display: 'Fraunces', Georgia, serif;
        --fc-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        height: auto;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      body {
        font-family: var(--fc-body);
        background: var(--fc-canvas);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        height: auto;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        /* Evita zoom por doble toque; overscroll auto evita scroll “pegajoso” en iOS. */
        touch-action: manipulation;
        overscroll-behavior-y: auto;
      }
      /* Splash screen mientras carga */
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        background: var(--fc-canvas);
        display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 20px;
        transition: opacity 0.32s ease;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      .splash-logo img {
        height: 56px;
        width: auto;
        max-width: min(calc(100vw - 48px), 320px);
        display: block;
        object-fit: contain;
      }
      .splash-sub {
        color: var(--fc-text-mid);
        font-size: 12px;
        letter-spacing: 2px;
        text-transform: uppercase;
        font-weight: 600;
      }
      .splash-loader {
        width: 56px;
        height: 3px;
        background: var(--fc-border);
        border-radius: 2px;
        overflow: hidden;
      }
      .splash-loader-bar {
        height: 100%;
        width: 40%;
        background: var(--fc-accent);
        border-radius: 2px;
        animation: splash-bar 1.2s ease-in-out infinite;
      }
      @keyframes splash-bar {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(320%); }
      }
      /* Ocultar scrollbar en móvil */
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-thumb { background: var(--fc-border-hi, #CFC0AC); border-radius: 2px; }
      /* Safe area para iPhone X+ */
      .safe-top    { padding-top: env(safe-area-inset-top); }
      .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
    </style>
  </head>
  <body>
    <!-- Splash screen -->
    <div id="splash">
      <div class="splash-logo">
        <img src="%PUBLIC_URL%/brand/farmacapital-logo-full.png?v=6" srcset="%PUBLIC_URL%/brand/farmacapital-logo-full@1x.png?v=6 812w, %PUBLIC_URL%/brand/farmacapital-logo-full.png?v=6 1623w" sizes="320px" alt="FarmaCapital" decoding="async" />
      </div>
      <div class="splash-sub">Farmacia & Salud</div>
      <div class="splash-loader"><div class="splash-loader-bar"></div></div>
    </div>

    <noscript>Para usar FarmaCapital necesitas activar JavaScript en tu navegador.</noscript>
    <div id="root"></div>

    <script>
      // Registrar Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .catch(e => console.warn('SW error:', e));
        });
      }
      // Ocultar splash. Antes habia un setTimeout de 1200 ms que hacia
      // esperar al usuario aunque React ya estuviera listo. Ahora lo
      // llama React al montar (src/index.js) y 'load' queda de respaldo.
      window.__fcOcultarSplash = function () {
        const splash = document.getElementById('splash');
        if (!splash || splash.classList.contains('hide')) return;
        splash.classList.add('hide');
        setTimeout(() => splash.remove(), 320);
      };
      window.addEventListener('load', () => window.__fcOcultarSplash());
    </script>
  </body>
