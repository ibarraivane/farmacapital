          return base + (dark ? "/favicon-32-dark.png?v=" + v : "/favicon-32.png?v=" + v);

    <!-- Estilos base -->
    <style>
      /* Duplicado intencional de src/theme/tokens.js: el splash necesita
         estos valores antes de que cargue el bundle de React. */
      :root {
        --fc-ink: #001534;
        --fc-blue: #054ABC;
        --fc-jade: #02A158;
        --fc-canvas: #F4ECE2;
        --fc-surface: #FBFAF8;
        --fc-border: #E4D9CA;
        --fc-accent: #C9451F;
        --fc-text-mid: #5A6472;
        --fc-display: 'Fraunces', Georgia, serif;
        --fc-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        height: auto;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      body {
        font-family: var(--fc-body);
        background: var(--fc-canvas);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        height: auto;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        /* Evita zoom por doble toque; overscroll auto evita scroll “pegajoso” en iOS. */
        touch-action: manipulation;
        overscroll-behavior-y: auto;
      }
      /* Intro FarmaCapital — HTML/CSS, logo oficial PNG.
         Cruz 0–21.072%, centro 10.505%, wordmark desde 25.570%.
         Las L copian el GIF: dos escuadras en los hombros de la cruz,
         verticales primero, estela que palidece, cruz oficial sin deformar. */
      #splash {
        --fc-gutter: max(22px, env(safe-area-inset-left), env(safe-area-inset-right));
        --fc-logo-w: min(calc(100vw - 2 * var(--fc-gutter)), clamp(300px, 62vw, 680px));
        --fc-logo-h: calc(var(--fc-logo-w) * 358 / 1623);
        --fc-cross-w: 0.21072;
        --fc-cross-c: 0.10505;
        --fc-shift: 0.39495;
        --fc-clip-r: 78.928%;
        --fc-text-x: 25.57%;
        --fc-cw: calc(var(--fc-logo-w) * var(--fc-cross-w));
        --fc-ch: var(--fc-logo-h);
        --fc-lnx: calc(50% - var(--fc-cw) * 0.161);
        --fc-lny: calc(50% - var(--fc-ch) * 0.176);
        --fc-lbx: calc(50% + var(--fc-cw) * 0.161);
        --fc-lby: calc(50% + var(--fc-ch) * 0.159);
        --fc-over: max(3px, calc(var(--fc-cw) * 0.04));
        --fc-trail-h: max(44px, calc(var(--fc-cw) * 0.72));
        --fc-trail-v: max(32px, calc(var(--fc-ch) * 0.48));
        --fc-v0: 12vh;
        --fc-v1: 73vh;
        --fc-hair: 3px;
        position: fixed;
        inset: 0;
        z-index: 9999;
        background:
          radial-gradient(ellipse 72% 50% at 50% 48%, #E7F1FB 0%, rgba(246, 248, 250, 0) 64%),
          #F6F8FA;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        isolation: isolate;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        touch-action: none;
        transition: opacity 0.32s ease;
      }
      @media (max-width: 480px) {
        #splash { --fc-logo-w: calc(100vw - 2 * var(--fc-gutter)); }
      }
      #splash.fc-intro-out .fc-intro-logo,
      #splash.fc-intro-out .fc-intro-sub {
        opacity: 0 !important;
        animation: none !important;
        transition: opacity 0.18s ease !important;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      .fc-intro-cluster {
        position: relative;
        z-index: 3;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: var(--fc-logo-w);
        max-width: 100%;
        flex-shrink: 0;
      }
      .fc-intro-stage {
        position: relative;
        width: 100%;
        height: var(--fc-logo-h);
        max-width: 100%;
        aspect-ratio: 1623 / 358;
      }
      .fc-intro-logo {
        display: block;
        width: 100%;
        height: 100%;
        max-width: 100%;
        aspect-ratio: 1623 / 358;
        object-fit: contain;
        opacity: 0;
        transform-origin: 10.505% 50%;
        transform: translateX(calc(var(--fc-shift) * 100%));
        clip-path: inset(0 var(--fc-clip-r) 0 0);
        -webkit-clip-path: inset(0 var(--fc-clip-r) 0 0);
      }
      #splash.fc-intro-play .fc-intro-logo {
        animation: fc-intro-logo 2.6s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes fc-intro-logo {
        0%, 26% {
          opacity: 0;
          transform: translateX(calc(var(--fc-shift) * 100%));
          clip-path: inset(0 var(--fc-clip-r) 0 0);
          -webkit-clip-path: inset(0 var(--fc-clip-r) 0 0);
        }
        30%, 46% {
          opacity: 1;
          transform: translateX(calc(var(--fc-shift) * 100%));
          clip-path: inset(0 var(--fc-clip-r) 0 0);
          -webkit-clip-path: inset(0 var(--fc-clip-r) 0 0);
        }
        62% {
          opacity: 1;
          transform: translateX(calc(var(--fc-shift) * 42%));
          clip-path: inset(0 0 0 0);
          -webkit-clip-path: inset(0 0 0 0);
        }
        72%, 100% {
          opacity: 1;
          transform: translateX(0);
          clip-path: inset(0 0 0 0);
          -webkit-clip-path: inset(0 0 0 0);
        }
      }
      .fc-intro-sub {
        position: absolute;
        left: var(--fc-text-x);
        width: calc(100% - var(--fc-text-x));
        top: calc(100% + 6px);
        margin: 0;
        color: var(--fc-text-mid);
        font-family: var(--fc-body);
        font-size: clamp(13px, 2.4vw, 16px);
        font-weight: 600;
        letter-spacing: 0.18em;
        line-height: 1.15;
        text-transform: uppercase;
        text-align: center;
        opacity: 0;
        transform: translateY(4px);
        pointer-events: none;
      }
      #splash.fc-intro-play .fc-intro-sub {
        animation: fc-intro-sub 2.6s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes fc-intro-sub {
        0%, 70% { opacity: 0; transform: translateY(4px); }
        80%, 100% { opacity: 1; transform: translateY(0); }
      }
      .fc-intro-lines {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 4;
      }
      .fc-hair {
        position: absolute;
        background: currentColor;
        border-radius: 0;
      }
      .fc-hair-h {
        height: var(--fc-hair);
        margin-top: calc(var(--fc-hair) / -2);
      }
      .fc-hair-v {
        width: var(--fc-hair);
        margin-left: calc(var(--fc-hair) / -2);
      }
      .fc-hair-left {
        top: var(--fc-lny);
        left: 0;
        width: calc(var(--fc-lnx) + var(--fc-over));
        color: #BEC5D1;
      }
      .fc-hair-top {
        left: var(--fc-lnx);
        top: var(--fc-v0);
        height: calc(var(--fc-lny) + var(--fc-over) - var(--fc-v0));
        color: #BEC5D1;
      }
      .fc-hair-right {
        top: var(--fc-lby);
        left: calc(var(--fc-lbx) - var(--fc-over));
        width: calc(100% - (var(--fc-lbx) - var(--fc-over)));
        color: #99B5E8;
      }
      .fc-hair-bot {
        left: var(--fc-lbx);
        top: calc(var(--fc-lby) - var(--fc-over));
        height: calc(var(--fc-v1) - (var(--fc-lby) - var(--fc-over)));
        color: #93D9BA;
      }
      #splash.fc-intro-play .fc-hair-left {
        animation: fc-navy-h 1.15s cubic-bezier(0.55, 0.05, 0.2, 1) both;
      }
      #splash.fc-intro-play .fc-hair-top {
        animation: fc-navy-v 1.15s cubic-bezier(0.55, 0.05, 0.2, 1) both;
      }
      #splash.fc-intro-play .fc-hair-right {
        animation: fc-blue-h 1.15s cubic-bezier(0.55, 0.05, 0.2, 1) both;
      }
      #splash.fc-intro-play .fc-hair-bot {
        animation: fc-jade-v 1.15s cubic-bezier(0.55, 0.05, 0.2, 1) both;
      }
      @keyframes fc-navy-h {
        0%, 32% {
          left: 0;
          width: calc(var(--fc-lnx) + var(--fc-over));
          color: #BEC5D1;
          opacity: 1;
        }
        18% { color: #5A6A7E; }
        32% { color: var(--fc-ink); }
        68%, 86% {
          left: calc(var(--fc-lnx) + var(--fc-over) - var(--fc-trail-h));
          width: var(--fc-trail-h);
          color: var(--fc-ink);
          opacity: 1;
        }
        86% { color: #C5CCD6; }
        100% {
          left: calc(var(--fc-lnx) + var(--fc-over) - var(--fc-trail-h));
          width: var(--fc-trail-h);
          color: #C5CCD6;
          opacity: 0;
        }
      }
      @keyframes fc-navy-v {
        0% {
          top: var(--fc-v0);
          height: calc(var(--fc-lny) + var(--fc-over) - var(--fc-v0));
          color: #BEC5D1;
          opacity: 1;
        }
        18% {
          top: var(--fc-v0);
          height: calc(var(--fc-lny) + var(--fc-over) - var(--fc-v0));
          color: #5A6A7E;
          opacity: 1;
        }
        32% {
          top: calc(var(--fc-v0) + 7vh);
          height: calc(var(--fc-lny) + var(--fc-over) - var(--fc-v0) - 7vh);
          color: var(--fc-ink);
          opacity: 1;
        }
        68%, 86% {
          top: calc(var(--fc-lny) + var(--fc-over) - var(--fc-trail-v));
          height: var(--fc-trail-v);
          color: var(--fc-ink);
          opacity: 1;
        }
        86% { color: #C5CCD6; }
        100% {
          top: calc(var(--fc-lny) + var(--fc-over) - var(--fc-trail-v));
          height: var(--fc-trail-v);
          color: #C5CCD6;
          opacity: 0;
        }
      }
      @keyframes fc-blue-h {
        0%, 32% {
          left: calc(var(--fc-lbx) - var(--fc-over));
          width: calc(100% - (var(--fc-lbx) - var(--fc-over)));
          color: #99B5E8;
          opacity: 1;
        }
        18% { color: #6A93DC; }
        32% { color: var(--fc-blue); }
        68%, 86% {
          left: calc(var(--fc-lbx) - var(--fc-over));
          width: var(--fc-trail-h);
          color: var(--fc-blue);
          opacity: 1;
        }
        86% { color: #C5D6F2; }
        100% {
          left: calc(var(--fc-lbx) - var(--fc-over));
          width: var(--fc-trail-h);
          color: #C5D6F2;
          opacity: 0;
        }
      }
      @keyframes fc-jade-v {
        0% {
          top: calc(var(--fc-lby) - var(--fc-over));
          height: calc(var(--fc-v1) - (var(--fc-lby) - var(--fc-over)));
          color: #93D9BA;
          opacity: 1;
        }
        18% {
          top: calc(var(--fc-lby) - var(--fc-over));
          height: calc(var(--fc-v1) - (var(--fc-lby) - var(--fc-over)));
          color: #4EC89A;
          opacity: 1;
        }
        32% {
          top: calc(var(--fc-lby) - var(--fc-over));
          height: calc(var(--fc-v1) - (var(--fc-lby) - var(--fc-over)) - 7vh);
          color: var(--fc-jade);
          opacity: 1;
        }
        68%, 86% {
          top: calc(var(--fc-lby) - var(--fc-over));
          height: var(--fc-trail-v);
          color: var(--fc-jade);
          opacity: 1;
        }
        86% { color: #B8E6D2; }
        100% {
          top: calc(var(--fc-lby) - var(--fc-over));
          height: var(--fc-trail-v);
          color: #B8E6D2;
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .fc-intro-lines { display: none; }
        .fc-intro-logo,
        #splash.fc-intro-play .fc-intro-logo,
        .fc-intro-sub,
        #splash.fc-intro-play .fc-intro-sub {
          opacity: 1 !important;
          transform: none !important;
          clip-path: none !important;
          -webkit-clip-path: none !important;
          animation: none !important;
          transition: none !important;
        }
      }
      /* Ocultar scrollbar en móvil */
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-thumb { background: var(--fc-border-hi, #CFC0AC); border-radius: 2px; }
      /* Safe area para iPhone X+ */
      .safe-top    { padding-top: env(safe-area-inset-top); }
      .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
    </style>

  <body>
    <!-- Intro FarmaCapital: líneas → cruz oficial → cortinilla del wordmark -->
    <div id="splash" role="img" aria-label="FarmaCapital" aria-busy="true">
      <div class="fc-intro-lines" aria-hidden="true">
        <span class="fc-hair fc-hair-navy fc-hair-h fc-hair-left"></span>
        <span class="fc-hair fc-hair-navy fc-hair-v fc-hair-top"></span>
        <span class="fc-hair fc-hair-blue fc-hair-h fc-hair-right"></span>
        <span class="fc-hair fc-hair-jade fc-hair-v fc-hair-bot"></span>
      </div>
      <div class="fc-intro-cluster">
        <div class="fc-intro-stage">
          <img
            class="fc-intro-logo"
            src="%PUBLIC_URL%/brand/farmacapital-logo-full.png?v=6"
            srcset="%PUBLIC_URL%/brand/farmacapital-logo-full@1x.png?v=6 812w, %PUBLIC_URL%/brand/farmacapital-logo-full.png?v=6 1623w"
            sizes="(max-width: 480px) calc(100vw - 44px), (max-width: 1100px) 62vw, 680px"
            alt="FarmaCapital"
            width="1623"
            height="358"
            decoding="sync"
            fetchpriority="high"
            draggable="false"
          />
          <p class="fc-intro-sub">Farmacia &amp; Salud</p>
        </div>
      </div>
    </div>

    <noscript>Para usar FarmaCapital necesitas activar JavaScript en tu navegador.</noscript>
    <div id="root"></div>

    <script>
      // Registrar Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .catch(e => console.warn('SW error:', e));
        });
      }
      // Intro: React (src/index.js) y 'load' solo avisan que la app está lista.
      // Si llegan antes, se espera la secuencia mínima. Si tardan, el logo
      // completo se queda en pantalla y el desvanecido ocurre al estar listos.
      (function () {
        var splash = document.getElementById('splash');
        var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var appReady = false;
        var sequenceDone = false;
        var hiding = false;

        function ocultar() {
          if (hiding || !splash || splash.classList.contains('hide')) return;
          if (!sequenceDone) return;
          if (!appReady) return;
          hiding = true;
          splash.setAttribute('aria-busy', 'false');
          var logo = splash.querySelector('.fc-intro-logo');
          if (logo) logo.style.willChange = 'auto';
          splash.classList.add('fc-intro-out');
          setTimeout(function () {
            splash.classList.add('hide');
            setTimeout(function () {
              if (splash && splash.parentNode) splash.remove();
            }, 340);
          }, 180);
        }

        window.__fcOcultarSplash = function () {
          appReady = true;
          ocultar();
        };

        function terminarSecuencia() {
          sequenceDone = true;
          ocultar();
        }

        var started = false;
        function iniciar() {
          if (started) return;
          started = true;
          if (!splash) {
            sequenceDone = true;
            return;
          }
          if (reduced) {
            splash.classList.add('fc-intro-reduced', 'fc-intro-play');
            setTimeout(terminarSecuencia, 280);
            return;
          }
          splash.offsetWidth;
          splash.classList.add('fc-intro-play');
          setTimeout(function () {
            var logoEl = splash.querySelector('.fc-intro-logo');
            if (logoEl) logoEl.style.willChange = 'auto';
          }, 1900);
          setTimeout(terminarSecuencia, 2620);
        }

        (function esperarLogo() {
          var logoEl = splash && splash.querySelector('.fc-intro-logo');
          if (!logoEl || logoEl.complete) {
            iniciar();
            return;
          }
          logoEl.addEventListener('load', iniciar, { once: true });
          logoEl.addEventListener('error', iniciar, { once: true });
          setTimeout(iniciar, 450);
        })();

        window.addEventListener('load', function () {
          window.__fcOcultarSplash();
        });
        setTimeout(function () {
          appReady = true;
          sequenceDone = true;
          ocultar();
        }, 10000);
      })();
    </script>
  </body>
</html>
