<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 32 32">
  <style>
    #fc-icon-light { display: block; }
    #fc-icon-dark { display: none; }
    @media (prefers-color-scheme: dark) {
      #fc-icon-light { display: none; }
      #fc-icon-dark { display: block; }
    }
  </style>
  <image id="fc-icon-light" width="32" height="32" xlink:href="data:image/png;base64,"/>
  <image id="fc-icon-dark" width="32" height="32" xlink:href="data:image/png;base64,"/>
</svg>
