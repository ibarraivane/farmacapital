name: FARMAX DB Backup

# Se dispara por:
#   - Vercel Cron → /api/backup → repository_dispatch (event_type: farmax-backup)
#   - schedule de respaldo (por si /api/backup falla)
#   - workflow_dispatch (manual desde la UI)

on:
  repository_dispatch:
    types: [farmax-backup]
  schedule:
    - cron: "30 6 * * *" # 06:30 UTC (30 min después del trigger de Vercel)
  workflow_dispatch:

env:
  # Adelanta migración de acciones JavaScript a Node 24 (GitHub deprecó Node 20).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: farmax-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Debe ser >= la versión de Postgres de Supabase. Ajustar si cambia.
      PG_MAJOR: "17"

    steps:
      - name: Checkout repo principal (código del script)
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Instalar postgresql-client-${{ env.PG_MAJOR }}
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates gnupg lsb-release
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/postgresql-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql-archive-keyring.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-${PG_MAJOR}"
          # Forzar v17 al inicio del PATH (Ubuntu default es v16)
          echo "/usr/lib/postgresql/${PG_MAJOR}/bin" >> $GITHUB_PATH
          # Verificar versión correcta
          /usr/lib/postgresql/${PG_MAJOR}/bin/pg_dump --version
          which pg_dump

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24.x"

      - name: Validar secretos requeridos
        env:
          SUPABASE_DB_URL:     ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_GITHUB_REPO:  ${{ secrets.BACKUP_GITHUB_REPO }}
          BACKUP_GITHUB_TOKEN: ${{ secrets.BACKUP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          miss=0
          for v in SUPABASE_DB_URL BACKUP_GITHUB_REPO BACKUP_GITHUB_TOKEN; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Falta secreto requerido: $v"
              miss=1
            fi
          done
          if [ "$miss" -ne 0 ]; then
            echo "Configura los secrets faltantes en GitHub Actions y reintenta."
            exit 1
          fi

      - name: Ejecutar backup end-to-end
        id: run_backup
        env:
          PATH:                /usr/lib/postgresql/17/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          SUPABASE_DB_URL:     ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_GITHUB_REPO:  ${{ secrets.BACKUP_GITHUB_REPO }}
          BACKUP_GITHUB_TOKEN: ${{ secrets.BACKUP_GITHUB_TOKEN }}
          BACKUP_OUTPUT_DIR:   ${{ github.workspace }}/tmp/backups
          BACKUP_MAX_SIZE_MB:  "500"
          BACKUP_MIN_SIZE_KB:  "10"
          BACKUP_TIMEOUT_SEC:  "900"
          BACKUP_SUBDIR:       "backups"
          BACKUP_RETENTION_DAYS: "30"
        run: |
          set -euo pipefail
          node scripts/backup-db.js | tee backup.log
          if [ ! -f backup.log ]; then
            echo "backup.log no existe tras ejecutar backup-db.js"
            exit 1
          fi
          BACKUP_PATH=$(node -e "const fs=require('fs');const s=fs.readFileSync('backup.log','utf8');const m=[...s.matchAll(/::backup-path::([^\r\n]+)/g)];if(!m.length)process.exit(2);process.stdout.write(m.at(-1)[1].trim());")
          BACKUP_FILENAME=$(node -e "const fs=require('fs');const s=fs.readFileSync('backup.log','utf8');const m=[...s.matchAll(/::backup-filename::([^\r\n]+)/g)];if(!m.length)process.exit(2);process.stdout.write(m.at(-1)[1].trim());")
          BACKUP_SIZE_BYTES=$(node -e "const fs=require('fs');const s=fs.readFileSync('backup.log','utf8');const m=[...s.matchAll(/::backup-size-bytes::([^\r\n]+)/g)];if(!m.length)process.exit(2);process.stdout.write(m.at(-1)[1].trim());")
          if [ -z "$BACKUP_PATH" ] || [ ! -f "$BACKUP_PATH" ]; then
            echo "No se encontró ruta de backup válida en backup.log: '$BACKUP_PATH'"
            exit 1
          fi
          {
            echo "backup_path=$BACKUP_PATH"
            echo "backup_filename=$BACKUP_FILENAME"
            echo "backup_size_bytes=$BACKUP_SIZE_BYTES"
          } >> "$GITHUB_OUTPUT"

      - name: Validar integridad del dump
        if: success()
        run: |
          BACKUP_PATH="${{ steps.run_backup.outputs.backup_path }}"
          if [ -z "$BACKUP_PATH" ] || [ ! -f "$BACKUP_PATH" ]; then
            echo "No se encontró ruta de backup o el archivo no existe."
            exit 1
          fi
          pg_restore --list "$BACKUP_PATH" > /dev/null
          echo "✅ Dump íntegro y legible"

      - name: Resumen
        if: always()
        run: |
          echo "## Backup FARMAX" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trigger: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Destino: ${{ secrets.BACKUP_GITHUB_REPO }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.run_backup.outputs.backup_filename }}" ]; then
            echo "- Archivo: ${{ steps.run_backup.outputs.backup_filename }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Tamaño: ${{ steps.run_backup.outputs.backup_size_bytes }} bytes" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Schema: \`schema/schema.sql\` en el repo privado (pg_dump --schema-only + gate de secretos literales)" >> "$GITHUB_STEP_SUMMARY"